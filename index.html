<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%2314171C'/><path d='M24 72V28h11l19 28V28h10v44H53L34 44v28H24z' fill='%23F4F2EE'/><circle cx='76' cy='66' r='6' fill='%235B7C99'/></svg>"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Narasimha Manam — Full Stack & Generative AI Portfolio</title>
    <meta
      name="description"
      content="Interactive 3D developer portfolio of Narasimha Manam featuring full-stack engineering, generative AI systems, RAG architectures, and an embedded Stockfish chess arena."
    />
    <meta
      name="keywords"
      content="Narasimha Manam, Full Stack Developer, Generative AI Engineer, RAG, Three.js, React, FastAPI, Machine Learning, Portfolio"
    />
    <meta name="theme-color" content="#F4F2EE" id="meta-theme-color" />
    <meta property="og:title" content="Narasimha Manam — Full Stack & Generative AI Portfolio" />
    <meta
      property="og:description"
      content="Interactive 3D developer portfolio of Narasimha Manam featuring full-stack engineering, generative AI systems, RAG architectures, and an embedded Stockfish chess arena."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://narasimha-manam-portfolio.vercel.app" />
    <!-- Refined Typography: Plus Jakarta Sans (variable sans), Fraunces (editorial serif accent), JetBrains Mono (tabular code/metrics) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("nm-portfolio-theme");
          var prefersDark =
            window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
          var theme = saved === "dark" || saved === "light" ? saved : prefersDark ? "dark" : "light";
          document.documentElement.setAttribute("data-theme", theme);
          if (theme === "dark") {
            document.documentElement.classList.add("dark");
          } else {
            document.documentElement.classList.remove("dark");
          }
          var meta = document.getElementById("meta-theme-color");
          if (meta) {
            meta.setAttribute("content", theme === "dark" ? "#0E1116" : "#F4F2EE");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
